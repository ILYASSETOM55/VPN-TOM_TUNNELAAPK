<!DOCTYPE html>
<html lang="fr" data-accent="burkina" data-theme="dark" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOM_TUNNEL</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF;--bg2:#F4F5F7;--card:#FFFFFF;--line:#E6E8EC;--tx:#12202F;--mut:#66727F;
  --desk:#E9ECF0;
  --blue:#0B2A5B;--brand-j:#0B1F3A;--brand-t:#00C2A8;
  --red:#EF2B2D;--yel:#FCD116;--grn:#00A896;
  --acc:#00A896;--on-acc:#FFFFFF;
  --acc-ink:color-mix(in srgb,var(--acc) 80%,black);
  --acc-soft:color-mix(in srgb,var(--acc) 11%,transparent);
  --r1:#EF2B2D;--r2:#FCD116;--r3:#0A9B4A;
  --shadow:0 1px 2px rgba(18,32,47,.05),0 8px 22px rgba(18,32,47,.06);
  --err-bg:#FDEEEE;--err-tx:#9B1C1F;
}
:root[data-accent="blanc"]{--bg:#F8FAFC;--bg2:#EEF1F5;--brand-j:#14213D;--shadow:0 1px 2px rgba(18,32,47,.03),0 10px 30px rgba(18,32,47,.07)}
:root[data-theme="dark"]{
  --bg:#0E141B;--bg2:#17202A;--card:#131B24;--line:#232F3B;--tx:#EAF0F6;--mut:#93A1B0;--desk:#070B10;
  --brand-j:#7EB8FF;--brand-t:#2EE6C5;
  --acc-ink:color-mix(in srgb,var(--acc) 70%,white);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  --err-bg:#2B1618;--err-tx:#FF9EA0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,select{ -webkit-user-select:text;user-select:text }
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button,.card,.srv,.chip,.nav{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}
button:active{transform:scale(.985)}
.card,.srv,.chip{border-radius:18px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;max-width:440px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){
  .stage{padding:20px}
  .device{height:min(900px,100%);border-radius:40px;border:3px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--r1) 0%,var(--r2) 48%,var(--r3) 100%) border-box;box-shadow:0 30px 80px rgba(10,20,30,.22)}
}
.flagbar{display:flex;height:3px;flex:none}
.flagbar i{flex:1}
.flagbar i:nth-child(1){background:var(--r1)}.flagbar i:nth-child(2){background:var(--r2)}.flagbar i:nth-child(3){background:var(--r3)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 22px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}

/* nav */
.nav{display:flex;flex:none;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px 8px}
.nav button{flex:1;min-width:0;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 4px;font-size:11.5px;font-weight:600;color:var(--mut);cursor:pointer;position:relative}
.nav button.on{color:var(--acc-ink)}
.nav button.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--acc)}
.nav button:focus-visible,.btn:focus-visible,.ib:focus-visible,.row:focus-visible,.act:focus-visible,.card.tap:focus-visible,.chip:focus-visible,.pwr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand svg{display:block;border-radius:12px}
.wm{font-weight:800;font-size:18px;line-height:1.05;letter-spacing:-.3px}
.wm b{color:var(--brand-j)}.wm em{font-style:normal;color:var(--brand-t)}
.tag{display:block;font-size:8px;font-weight:700;letter-spacing:.3px;color:var(--mut);margin-top:3px;white-space:nowrap}
.chip{flex:1;min-width:0;max-width:200px;display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:9px 8px 9px 14px;text-align:left;cursor:pointer}
.chip .t{flex:1;min-width:0}
.chip .a{font-size:12px;font-weight:700;overflow-wrap:break-word}
.chip .b{font-size:10.5px;color:var(--mut);overflow-wrap:break-word}
.chip svg{flex:none;color:var(--mut)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* Carte IP compacte */
.ip-card{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding:12px 14px;border:1px solid var(--ip-border,var(--line));border-radius:16px;background:var(--ip-bg,var(--bg2));min-width:0;transition:border-color .2s,background .2s}
.ip-card.good{--ip-border:#0A9B67;--ip-bg:rgba(10,155,103,.13);--ip-color:#35D99A}
.ip-card.bad{--ip-border:#E34C55;--ip-bg:rgba(227,76,85,.11);--ip-color:#FF737B}
.ip-card.wait{--ip-border:var(--line);--ip-bg:var(--bg2);--ip-color:var(--mut)}
.ip-mark{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ip-color,var(--mut));box-shadow:0 0 0 4px color-mix(in srgb,var(--ip-color,var(--mut)) 16%,transparent)}
.ip-info{min-width:0;flex:1}.ip-label{font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--mut);margin-bottom:3px}.ip-value{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--ip-color,var(--tx));overflow-wrap:anywhere;line-height:1.25}
.ip-sub{font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ip-sub:empty{display:none}
.ip-copy{border:0;background:transparent;color:var(--ip-color,var(--mut));padding:5px;display:grid;place-items:center;flex:none}


/* Actions de partage : icônes mieux mises en valeur sans agrandir la feuille */
.share-options .row{gap:12px;padding:13px 5px;min-height:68px}
.share-options .row .bub{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--acc-soft),var(--bg2));border:1px solid color-mix(in srgb,var(--acc) 24%,var(--line));box-shadow:inset 0 1px rgba(255,255,255,.035);color:var(--acc-ink)}
.share-options .row .bub svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.10))}
.share-options .row .tt{line-height:1.25}
.share-options .row .ss{line-height:1.4;margin-top:3px}

/* power */
.ringwrap{position:relative;width:216px;height:216px;margin:26px auto 10px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--r1) 0 33.3%,var(--r2) 0 66.6%,var(--r3) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));opacity:.45;transition:opacity .3s}
.connecting .ring{opacity:1;animation:spin 1.3s linear infinite}
.connected .ring{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{position:absolute;inset:10px;border-radius:50%;border:2px solid var(--acc);opacity:0;pointer-events:none}
.connected .halo{animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{opacity:.5;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.pwr{position:relative;width:176px;height:176px;border-radius:50%;border:none;background:var(--card);color:var(--mut);cursor:pointer;display:grid;place-items:center;box-shadow:0 12px 30px rgba(18,32,47,.14),inset 0 0 0 1px var(--line);transition:background .3s,color .3s,transform .15s}
.pwr:active{transform:scale(.97)}
.connecting .pwr{color:var(--acc-ink)}
.connected .pwr{background:var(--acc);color:var(--on-acc);box-shadow:0 14px 34px rgba(18,32,47,.22)}
.state{text-align:center;margin-bottom:18px}
.state h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
.state.ok h2{color:var(--acc-ink)}
.state p{margin:3px 0 0;color:var(--mut);font-size:13.5px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:12px}
.card.tap{cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.lbl{font-size:12px;font-weight:600;color:var(--mut)}
.big{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.grow{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--acc)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.link{background:none;border:none;color:var(--acc-ink);font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px}
.tr{display:grid;grid-template-columns:1fr 1px 1fr;gap:12px}
.tr .sep{background:var(--line)}
.tr .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.ico.d{background:rgba(10,155,74,.12);color:#0A9B4A}
.ico.u{background:rgba(239,43,45,.11);color:#E0262A}
.num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.num small{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:0}
.rate{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.two .card{margin-bottom:0}
.clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:2px}
.err{display:flex;gap:10px;background:var(--err-bg);color:var(--err-tx);border-radius:16px;padding:12px 14px;margin-top:14px;border-left:4px solid var(--red)}
.err b{display:block;font-size:13.5px}.err span{font-size:12.5px}
.err .ib{margin-left:auto;color:inherit;align-self:flex-start}

/* pages */
.ph{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.ph h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0}
.ph.back h1{font-size:20px}
.ib{width:38px;height:38px;border-radius:12px;border:none;background:var(--bg2);display:grid;place-items:center;cursor:pointer;flex:none}
.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--bg2)}
.btn.danger{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:10px 14px;font-size:13.5px}
.row{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;text-align:left;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .bub{width:40px;height:40px;border-radius:13px;background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--acc-ink)}
.row .tt{font-weight:700;font-size:15px}
.row .ss{font-size:12.5px;color:var(--mut)}
.row>svg:last-child{color:var(--mut);flex:none}
.card.list{padding:4px 14px}

/* servers */
.srv{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.srv.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--shadow)}
.srv-top{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px}
.srv-name{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.pill{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;background:var(--bg2);border-radius:99px;padding:3px 10px;color:var(--mut)}
.badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--acc-soft);color:var(--acc-ink);border-radius:99px;padding:4px 10px;white-space:nowrap}
.acts{display:flex;border-top:1px solid var(--line)}
.act{flex:1;min-width:0;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;border-right:1px solid var(--line)}
.act:last-child{border-right:none}
.act.on{color:var(--acc-ink)}
.act.del{color:var(--err-tx)}
.empty{text-align:center;color:var(--mut);padding:34px 20px;font-size:14px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

/* log */
.lg{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:none}
.lg time{font-size:12px;font-weight:700;color:var(--mut);width:42px;flex:none;font-variant-numeric:tabular-nums;padding-top:1px}
.lg .d{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--grn)}
.lg .d.err{background:var(--red)}.lg .d.imp{background:var(--yel)}
.lg b{font-size:14px;display:block}.lg span{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}

/* forms */
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px;background:var(--card)}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg.grid{display:grid;grid-template-columns:1fr 1fr}
.seg button{border:none;background:none;padding:10px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;flex:1}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
.sec{font-size:12.5px;font-weight:700;color:var(--mut);margin:18px 2px 8px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.tg b{font-size:14.5px;display:block}.tg span{font-size:12.5px;color:var(--mut)}
.sw{width:46px;height:28px;border-radius:99px;border:none;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.msg{color:var(--err-tx);font-size:13px;font-weight:600;margin:0 0 12px;background:var(--err-bg);padding:10px 12px;border-radius:12px}
.hint{font-size:12.5px;color:var(--mut);margin:0 0 14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}.kv span:first-child{color:var(--mut)}.kv span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}
.swatch{display:flex;gap:3px;flex:none;width:52px}
.swatch i{width:14px;height:14px;border-radius:50%;display:block}

/* sheet */
.layer{position:absolute;inset:0;display:none;z-index:20}
.layer.on{display:flex;align-items:flex-end}
.layer.center{align-items:center;justify-content:center;padding:24px}
.layer .back{position:absolute;inset:0;background:rgba(8,14,20,.45)}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px 22px;animation:up .26s ease-out}
.layer.center .sheet{border-radius:24px;max-width:340px;animation:pop .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.sh-head h3{margin:0}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet .lead{margin:0 0 14px;color:var(--mut);font-size:13.5px}
.btns{display:flex;gap:10px;margin-top:6px}.btns .btn{flex:1}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.apps button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;padding:6px 0}
.apps i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.fp{background:var(--bg2);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.fp b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.hidden{display:none!important}

#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,12px);background:#12202F;color:#fff;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#C92A35}#toast.good{background:#0A9B67}
.wv{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:14px 0}
.wv-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);padding:10px 12px;font-size:12.5px;color:var(--mut);font-weight:600}
.wv-bar i{display:block;height:2px;background:var(--acc);width:60%;position:absolute}
.wv-body{padding:34px 18px;text-align:center;color:var(--mut);font-size:13.5px;background:var(--card)}
.star{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;max-width:230px}.star i{flex:1;height:3px;border-radius:3px}.star i:first-child{background:linear-gradient(90deg,transparent,var(--r1))}.star i:last-child{background:linear-gradient(90deg,var(--r3),transparent)}
.ava{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line),var(--shadow);display:block;margin:0 auto 10px}

/* ---- éléments communs (inspirés de la maquette) ---- */
.bub2{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--brand-j)}
.bub2.lg{width:46px;height:46px}
.gearrow{display:flex;justify-content:flex-end;margin-top:10px}
.ib.gear{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
.ttl{display:inline-flex;align-items:center;gap:10px;font-size:16px}
.link{display:inline-flex;align-items:center;gap:6px}
.tc{display:flex;gap:10px;align-items:center;min-width:0}
.tc .num{font-size:17px}.tc .num small{font-size:11px}
.ico.big{width:34px;height:34px;border-radius:50%;margin:0;flex:none}
.row2{display:flex;align-items:center;gap:12px;padding:12px 16px}
.row2 .lbl{font-size:13.5px}
.clk{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.row2 .ico{margin:0;width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--mut);flex:none;display:grid;place-items:center}

/* ---- thème Blanc : fond blanc dominant, accents discrets ---- */
:root[data-accent="blanc"] .flagbar{display:none}
:root[data-accent="blanc"] .device{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg2) 60%,var(--bg)) 100%)}
@media (min-width:700px){:root[data-accent="blanc"] .device{border:1px solid var(--line);background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg2) 60%,var(--bg)) 100%)}}
:root[data-accent="blanc"] .device::before,:root[data-accent="blanc"] .device::after{content:"";position:absolute;z-index:0;pointer-events:none;border-radius:20px;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3));opacity:.9}
:root[data-accent="blanc"] .device::before{width:84px;height:12px;left:-32px;top:22px;transform:rotate(-42deg)}
:root[data-accent="blanc"] .device::after{width:130px;height:14px;right:-48px;bottom:36px;transform:rotate(-42deg)}
:root[data-accent="blanc"] #main,:root[data-accent="blanc"] .nav{position:relative;z-index:1}

<script>
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');

const I={

};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const LOGO='img/logo.png';
const logo=(s=40)=>`<img src="${LOGO}" width="${s}" height="${s}" alt="Logo TOM_TUNNEL" style="display:block;border-radius:${Math.round(s*.24)}px">`;

const logoHdr=()=>logo(38);
const wordmark=()=>`<div class="wm"><b>TOM</b><em>_TUNNEL</em><span class="tag">VPN • FAST • SECURE</span></div>`;

/* ---------- état ---------- */
const AVATAR='img/avatar.jpg';
let S={
  servers:[],
  selected:null,status:'idle',startTs:0,dl:0,ul:0,dlR:0,ulR:0,ping:null,
  logs:[],tab:'home',page:null,stack:[],error:null,perm:false,
  mode:'system',accent:'teal',boost:false,dns:'1.1.1.1',lang:'fr',tg:'https://t.me/FREE_INTERNET237',wa:'+237654145540',wa:'+237654145540',
  draft:null,sd:null,clip:null,ex:null,del:null
};
let timer=null;
const STATE_KEY='tt-state-v130';
function persistState(){
  try{
    const payload={servers:S.servers,selected:S.selected,logs:S.logs,dns:S.dns,boost:!!S.boost};
    const raw=JSON.stringify(payload);
    localStorage.setItem(STATE_KEY,raw);
    if(NATIVE&&JT.saveState)JT.saveState(raw);
  }catch(e){}
}
function loadNativeState(raw){
  try{
    const o=JSON.parse(raw||'{}');
    if(Array.isArray(o.servers))S.servers=o.servers;
    if(o.selected!==null&&o.selected!==undefined)S.selected=o.selected;
    if(Array.isArray(o.logs))S.logs=o.logs;
    if(typeof o.dns==='string'&&o.dns.trim())S.dns=o.dns.trim();
    if(typeof o.boost==='boolean')S.boost=o.boost;
    if(S.selected!==null&&!S.servers.some(s=>s.id===S.selected))S.selected=S.servers[0]?.id||null;
    render();
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STATE_KEY);
    if(raw)loadNativeState(raw);
  }catch(e){}
}
const NATIVE=typeof window.JT!=='undefined';
window.onVpn=(st,msg)=>{
  clearInterval(timer);timer=null;
  if(st==='connecting'){S.status='connecting';S.error=null;render();return}
  if(st==='connected'){S.status='connected';S.startTs=Date.now();S.error=null;log('VPN connecté',curServer()?curServer().name:'');timer=setInterval(upd,1000);
    /* Le code Android natif doit créer/mettre à jour la notification système. */
    try{if(NATIVE&&JT.updateVpnNotification)JT.updateVpnNotification(curServer()?curServer().name:'Serveur VPN','connecté')}catch(e){}
  }
  else{const was=S.status==='connected';S.status='idle';S.dlR=0;S.ulR=0;S.ping=null;
    try{if(NATIVE&&JT.hideVpnNotification)JT.hideVpnNotification()}catch(e){}
    if(st==='error'){S.error={title:'Connexion impossible',msg:msg||'Erreur inconnue'};log('Erreur de connexion',msg||'','err')}
    else if(was)log('VPN déconnecté','')}
  render()};
/* Actions appelées par les boutons de la notification Android. */
window.onNotificationAction=(action)=>{
  if(action==='disconnect'||action==='stop'){disconnect();return}
  if(action==='reconnect'){
    const sv=curServer();
    if(!sv){toast('Aucun serveur sélectionné');return}
    if(S.status!=='idle')disconnect(true);
    setTimeout(()=>connect(),250);
  }
};
window.onStats=(dl,ul,dlR,ulR,ping)=>{S.dl=dl;S.ul=ul;S.dlR=dlR;S.ulR=ulR;S.ping=ping<0?null:ping;upd()};
const curServer=()=>S.servers.find(s=>s.id===S.selected)||null;

const THEME_KEY='tt-theme3';
const DARK_MQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function saveTheme(){try{localStorage.setItem(THEME_KEY,JSON.stringify({mode:S.mode}))}catch(e){}}
function loadTheme(){
  S.accent='burkina';S.mode='system';
  try{
    const t=JSON.parse(localStorage.getItem(THEME_KEY)||'null');
    if(t&&['light','dark','system'].includes(t.mode)){S.mode=t.mode;return}
    const o=JSON.parse(localStorage.getItem('tt-theme2')||'null');
    if(o&&['light','dark'].includes(o.mode))S.mode=o.mode;
  }catch(e){}
}
function resolvedMode(){return S.mode==='system'?((DARK_MQ&&DARK_MQ.matches)?'dark':'light'):S.mode}
function applyTheme(){
  const R=document.documentElement,m=resolvedMode();
  R.setAttribute('data-theme',m);R.setAttribute('data-accent','burkina');
  R.style.colorScheme=m;
  let mt=document.querySelector('meta[name=theme-color]');
  if(!mt){mt=document.createElement('meta');mt.name='theme-color';document.head.appendChild(mt)}
  mt.content=m==='dark'?'#0E141B':'#FFFFFF';
}
if(DARK_MQ){const onSys=()=>{if(S.mode==='system')applyTheme()};DARK_MQ.addEventListener?DARK_MQ.addEventListener('change',onSys):DARK_MQ.addListener(onSys)}

function toast(m,kind){const t=$('#toast');t.textContent=m;t.classList.remove('bad','good');if(kind)t.classList.add(kind);t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),kind==='bad'?4200:2600)}
function log(title,sub,kind){
  S.logs.unshift({t:hhmm(),title,sub:sub||'',kind:kind||'info'});
  if(S.logs.length>200)S.logs.length=200;
  persistState();
  if(S.tab==='log'&&!S.page)render()
}

/* ---------- nav ---------- */
const TABS=[['home','Accueil','home'],['servers','Serveurs','server'],['log','Journal','clock'],['more','Plus','dots']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(t=>`<button onclick="go('${t[0]}')" class="${S.tab===t[0]?'on':''}" ${S.tab===t[0]?'aria-current="page"':''}>${ic(t[2],23)}<span>${t[1]}</span></button>`).join('');
}
function go(t){S.stack=[];S.page=null;S.tab=t;render();$('#main').scrollTop=0}
function openPage(p){S.stack.push({tab:S.tab,page:S.page});S.page=p;render();$('#main').scrollTop=0}
function closePage(){const prev=S.stack.pop();if(prev){S.tab=prev.tab;S.page=prev.page}else{S.page=null}render();$('#main').scrollTop=0}

function render(){
  const m=$('#main');
  m.classList.toggle('home',!S.page&&S.tab==='home');
  if(S.page){m.innerHTML=pageHTML()}
  else m.innerHTML=({home:homeHTML,servers:serversHTML,log:logHTML,more:moreHTML})[S.tab]();
  renderNav();
  paintIp();
}

/* ---------- accueil ---------- */
const fmtDur=()=>{if(S.status!=='connected')return '00:00:00';const s=Math.floor((Date.now()-S.startTs)/1000);return `${p2(s/3600|0)}:${p2((s%3600)/60|0)}:${p2(s%60)}`};
const mb=b=>(b/1048576).toFixed(2);
function homeHTML(){
  const sv=curServer(),st=S.status;
  const title=st==='connected'?'Connecté':st==='connecting'?'Connexion…':'Connecter';
  const hint=st==='connected'?'Appuyez pour vous déconnecter':st==='connecting'?'Établissement du tunnel…':'État réel du tunnel';
  const chip=sv
    ?`<div class="a">${esc(sv.name)}</div><div class="b">${esc(sv.type)}</div>`
    :`<div class="a">Choisir un serveur</div><div class="b">Sélectionnez un serveur</div>`;
  const card=sv
    ?`<div class="lbl">Serveur sélectionné</div><div class="big">JOELTOM</div><div class="sub">${esc(sv.type)}</div>`
    :`<div class="lbl">Serveur sélectionné</div><div class="big">Aucun serveur sélectionné</div><div class="sub">Choisir un serveur</div>`;
  const err=S.error?`<div class="err" role="alert">${ic('alert',20)}<div><b>${esc(S.error.title)}</b><span>${esc(S.error.msg)}</span></div><button class="ib" onclick="S.error=null;render()" aria-label="Fermer">${ic('x',18)}</button></div>`:'';
  return `
  <div class="top">
    <div class="brand">${logoHdr()}${wordmark()}</div>

// La liste est comparée au deuxième octet de l’IPv4 : 10.xx.x.x.
let detectedIp = '';
let ipState = null; // dernier état reçu du natif : {net, local, vpn, pub}
const NET_NAMES = {wifi:'Wi‑Fi', mobile:'Données mobiles', ethernet:'Ethernet', other:'Réseau'};
/* Liste des bons préfixes : 10.<n>.x.x — seul le 2e octet est comparé. */
const GOOD_10 = new Set([41,43,46,73,74,75,102,218,230,213,217,209,206,193,215,214,216,219,220,198,165,229,208,143,51,197,194,195,196,199,200,204,205,207,210,212,221,222,223,224,225,226,227,228]);
/* 'good' = bon IP · 'bad' = mauvais IP (préfixe 10.x hors liste) · 'na' = autre IP (non vérifié, aucun blocage) */
function ipVerdict(ip){
  const m=/^10\.(\d{1,3})\.\d{1,3}\.\d{1,3}$/.exec(String(ip||''));
  if(!m)return 'na';
  return GOOD_10.has(parseInt(m[1],10))?'good':'bad';
}
let lastVerdictKey='';
function paintIp(){
  const card=document.getElementById('ipCard'),value=document.getElementById('ipValue'),label=document.getElementById('ipLabel'),sub=document.getElementById('ipSub');
  if(!card||!value)return;
  const st=ipState;
  let main='',lab='IP DU TÉLÉPHONE',subTxt='',cls='wait',verdict='na';
  if(st){
    const nn=NET_NAMES[st.net]||'Réseau';
    if(st.net==='none'){main='Hors ligne';subTxt='Aucune connexion Internet';cls='bad';}
    else{
      main=st.local||st.pub||'IP indisponible';
      lab='IP DU TÉLÉPHONE · '+nn.toUpperCase()+(st.vpn?' · VPN actif':'');
      verdict=st.vpn?'good':ipVerdict(st.local);
      const pubTxt=st.pub?('IP publique : '+st.pub):'';
      if(st.vpn){cls='good';subTxt='✔ VPN connecté'+(pubTxt?' · '+pubTxt:'');}
      else if(verdict==='good'){cls='good';subTxt='✔ Bon IP'+(pubTxt?' · '+pubTxt:'');}
      else if(verdict==='bad'){cls='bad';subTxt='✖ Mauvais IP, connexion quand même possible'+(pubTxt?' · '+pubTxt:'');}
      else{cls=st.local?'good':'wait';subTxt=pubTxt;}
    }
  }else if(detectedIp){main=detectedIp;cls='good';}
  detectedIp=(main&&main!=='Hors ligne'&&main!=='IP indisponible')?main:'';
  value.textContent=main||'—';
  if(label)label.textContent=lab;
  if(sub)sub.textContent=subTxt;
  card.classList.remove('good','bad','wait');card.classList.add(cls);
  /* Notification passagère, une seule fois à chaque changement d'IP ou de verdict */
  if(st&&st.local){
    const key=st.vpn?'vpn':(st.local+'|'+verdict);
    if(key!==lastVerdictKey){
      lastVerdictKey=key;
      if(st.vpn){/* VPN actif : on reste vert, aucune alerte */}
      else if(verdict==='bad')toast('⚠ Mauvais IP : '+st.local,'bad');
      else if(verdict==='good')toast('✔ Bon IP : '+st.local,'good');
    }
  }
}

/* ---------- import presse-papier ---------- */
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);try{return decodeURIComponent(escape(r))}catch(e){return r}}
/* http -> h2 ; valeur vide -> tcp ; le serviceName gRPC est stocké dans « path » (attendu par le moteur) */
function normNet(n){n=String(n||'tcp').toLowerCase();return n==='http'?'h2':n}
function netPath(net,q){return net==='grpc'?(q.get('serviceName')||q.get('path')||''):(q.get('path')||'/')}
function parseLink(t){
  t=(t||'').trim();
  if(!t)return null;
  try{
    if(/^vmess:\/\//i.test(t)){
      const raw=t.slice(8).split('#')[0];
      const j=JSON.parse(b64d(raw));
      if(!j.add||!j.port||!j.id)return null;
      return {type:'VMESS',name:j.ps||'',addr:j.add,port:String(j.port),uuid:j.id,
        aid:String(j.aid==null?0:j.aid),network:normNet(j.net),
        tls:String(j.tls||'').toLowerCase()==='tls',
        security:String(j.tls||'').toLowerCase()==='tls'?'tls':'none',
        sni:j.sni||'',host:j.host||'',path:j.path||'/',flow:j.flow||'',
        alpn:j.alpn||'',fp:j.fp||'chrome'};
    }

    if(/^vless:\/\//i.test(t)||/^trojan:\/\//i.test(t)){
      const u=new URL(t);
      const q=u.searchParams;
      const type=u.protocol.slice(0,-1).toLowerCase();
      const name=u.hash?decodeURIComponent(u.hash.slice(1)):'';
      const addr=u.hostname.replace(/^\[|\]$/g,'');
      const port=String(u.port||443);
      if(!u.username||!addr)return null;

      if(type==='vless'){
        if(!/^[0-9a-f-]{32,36}$/i.test(u.username))return null;
        const net=normNet(q.get('type'));
        return {type:'VLESS',name,addr,port,uuid:decodeURIComponent(u.username),
          network:net,security:q.get('security')||'none',
          sni:q.get('sni')||q.get('peer')||'',host:q.get('host')||'',path:netPath(net,q),
          flow:q.get('flow')||'',alpn:q.get('alpn')||'',fp:q.get('fp')||'chrome',
          pbk:q.get('pbk')||'',sid:q.get('sid')||'',spx:q.get('spx')||'/'};
      }

      const tnet=normNet(q.get('type'));
      return {type:'TROJAN',name,addr,port,pass:decodeURIComponent(u.username),
        network:tnet,security:(q.get('security')||'tls')==='none'?'none':'tls',
        tls:(q.get('security')||'tls')!=='none',sni:q.get('sni')||q.get('peer')||'',
        host:q.get('host')||'',path:netPath(tnet,q),alpn:q.get('alpn')||'',fp:q.get('fp')||'chrome'};
    }

    if(/^ss:\/\//i.test(t)){
      const namePart=t.split('#').slice(1).join('#');
      const name=namePart?decodeURIComponent(namePart):'';
      const body=t.slice(5).split('#')[0].split('?')[0];
      let b2=body;
      if(b2.lastIndexOf('@')<0){try{b2=b64d(decodeURIComponent(b2))}catch(e){return null}}
      const at=b2.lastIndexOf('@');
      if(at<0)return null;
      let cred=decodeURIComponent(b2.slice(0,at));
      const hp=b2.slice(at+1);
      if(!cred.includes(':'))cred=b64d(cred);
      const i=cred.indexOf(':');
      if(i<1)return null;
      const method=cred.slice(0,i);
      const pass=cred.slice(i+1);
      const hm=hp.match(/^(\[[^\]]+\]|[^:]+):(\d+)$/);
      if(!hm||!method||!pass)return null;
      return {type:'Shadowsocks',name,addr:hm[1].replace(/^\[|\]$/g,''),port:hm[2],method,pass};
    }
  }catch(e){return null}
  return null;
}

async function askJephSecret(txt,name){
  txt=String(txt||'').replace(/\s+/g,'');
  if(txt.startsWith('JEPH2.')){askPassword(txt,name);return}
  // JEPH1 / JEPH3 : la clé de CET appareil est utilisée automatiquement, on ne la demande jamais
  try{
    if(txt.startsWith('JEPH3.')){
      const w=await openSealed(txt.replace(/^JEPH3\./,'JEPH1.'),myKey());
      if(!w||!w.jeph2)throw new Error('invalid');
      askPassword(w.jeph2,name);return;
    }
    const o=await openSealed(txt,myKey());
    if(!o||!o.type)throw new Error('invalid');
    closeSheet();confirmJephImport(o,name||'');
  }catch(e){notYours()}
}
function importParsedClipboard(t){
  S.clipRaw=(t||'').trim();
  const raw=S.clipRaw.replace(/\s+/g,'');
  if(/^JEPH[123]\./.test(raw)){askJephSecret(raw,'');return}
  if(/^Jeph:/i.test(raw)){
    try{
      let payload=raw.slice(5).replace(/-/g,'+').replace(/_/g,'/');
      while(payload.length%4)payload+='=';
      let decoded=decodeURIComponent(escape(atob(payload)));
      if(/^JEPH[123]\./.test(decoded)){askJephSecret(decoded,'');return}
      let o;
      try{o=JSON.parse(decoded)}catch(_){o=JSON.parse(decodeURIComponent(escape(atob(decoded))))}
      if(!o||!o.type)throw new Error('invalid');
      confirmJephImport(o,'');
      return;
    }catch(e){toast('Lien TOM invalide');return}

  const s=parseLink(S.clipRaw);

/* ---------- import .tom ---------- */
function openFile(){closeSheet();$('#fileIn').value='';$('#fileIn').click()}
let pendingJephFile = null;

function fileChosen(inp){
  const f = inp.files && inp.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result || '').trim();
    if(!txt){ toast('Fichier vide'); inp.value=''; return; }
    pendingJephFile = {text:txt, name:f.name, input:inp};
    if(/^(vless|vmess|trojan|ss):\/\//i.test(txt) || /^Jeph:/i.test(txt)){ importParsedClipboard(txt); return; }
    if(txt.charAt(0)==='{'){ try{ const o=JSON.parse(txt); if(o&&o.type){ confirmJephImport(o,f.name); return; } }catch(e){} }
    if(/^JEPH[123]\./.test(txt.replace(/\s+/g,''))){ askJephSecret(txt, f.name); return; }
    try{
      const o = JSON.parse(decodeURIComponent(escape(atob(txt))));
      if(!o || !o.type) throw new Error('invalid');
      confirmJephImport(o, f.name);
    }catch(e){
      pendingJephFile = null;
      inp.value='';
      toast('Fichier invalide ou format non reconnu');
    }
  };
  r.onerror = () => { pendingJephFile=null; inp.value=''; toast('Lecture du fichier impossible'); };
  r.readAsText(f);
}

function confirmJephImport(o, filename){
  if(!o || !o.type){ toast('Configuration invalide'); return; }
  const fallback = String(filename || '').replace(/\.tom$/i,'');
  const suggested = String(o.name || fallback || 'Serveur importé');
  sheet(`${shHead('Confirmer l’importation','openAdd()')}
    <p class="lead">Vérifiez le nom et les informations avant d’ajouter ce serveur.</p>
    <label class="f"><span>Nom du serveur</span><input id="importJephName" value="${esc(suggested)}" autocomplete="off"></label>
    ${o.expiryDate && /^\d{4}-\d{2}-\d{2}$/.test(o.expiryDate) ? `<p class="hint">Expiration : ${esc(o.expiryDate)}</p>` : ''}
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Annuler</button><button class="btn primary" onclick="finishJephImport()">Importer</button></div>`);
  window.pendingJephObject = o;
}

function finishJephImport(){
  const o = window.pendingJephObject;
  if(!o || !o.type){ toast('Aucun serveur à importer'); return; }
  o.name = ($('#importJephName').value || '').trim() || 'Serveur importé';
  o.id = Date.now();
  if(o.expiryDate && !/^\d{4}-\d{2}-\d{2}$/.test(o.expiryDate)) delete o.expiryDate;
  if(o.expiryDate && new Date(o.expiryDate+'T23:59:59').getTime() < Date.now()){ toast('Ce fichier a expiré'); window.pendingJephObject=null; pendingJephFile=null; return; }
  S.servers.push(o);
  persistState();
  log('Importation', o.name + ' · ' + o.type, 'imp');
  if(pendingJephFile && pendingJephFile.input) pendingJephFile.input.value='';
  window.pendingJephObject = null;
  pendingJephFile = null;
  closeSheet(); focusServer(o.id); toast('Serveur importé');
}

async function unlockFile(){
  const pending = pendingJephFile;
  if(!pending){ toast('Aucun fichier à déchiffrer'); return; }
  const entered = ($('#jkey').value || '');
  if(!entered){ $('#keyErr').innerHTML='<p class="msg" role="alert">Saisissez le mot de passe du fichier.</p>'; return; }
  try{
    const payload=pending.text.replace(/^JEPH2\./,'JEPH1.');
    const o = await openSealed(payload, 'PASS:'+entered);
    if(!o || !o.type) throw new Error('invalid');
    closeSheet();
    confirmJephImport(o, pending.name);
  }catch(e){
    $('#keyErr').innerHTML='<p class="msg" role="alert">Mot de passe incorrect.</p>';
  }
}

/* ---------- chiffrement .tom (clé du destinataire) ---------- */
const KEYRE=/^(JEPH-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}|TOM_TUNNEL-[A-Z0-9]{5}-[A-Z0-9]{5})$/;
const normKey=k=>String(k||'').toUpperCase().replace(/\s+/g,'');
const b64=u=>{let t='';u.forEach(c=>t+=String.fromCharCode(c));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const HAS_SUBTLE=!!(window.crypto&&crypto.subtle);
async function deriveKey(k,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const xs=(d,k)=>d.map((b,i)=>b^k.charCodeAt(i%k.length)^((i*31)&255)); // repli aperçu navigateur uniquement
async function sealFile(obj,key){
  const data=new TextEncoder().encode(JSON.stringify(obj));
  if(!HAS_SUBTLE)throw new Error('WebCrypto AES-GCM indisponible');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(key,salt),data));
  const out=new Uint8Array(29+ct.length);out[0]=0;out.set(salt,1);out.set(iv,17);out.set(ct,29);return 'JEPH1.'+b64(out)}
async function openSealed(text,key){
  const u=unb64(text.slice(6));
  if(u[0]===0){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(17,29)},await deriveKey(key,u.slice(1,17)),u.slice(29));return JSON.parse(new TextDecoder().decode(pt))}
  return JSON.parse(new TextDecoder().decode(xs(u.slice(1),key)))}
function jephContent(){return S.ex.content}
function saveExport(){if(NATIVE)JT.saveFile(S.ex.file,jephContent());log('Exportation',S.ex.file,'imp');closeSheet();toast(S.ex.file+(NATIVE?'':' enregistré (aperçu)'))}

function myKey(){
  try{let k=localStorage.getItem('tt-device-key');
    if(!k){const a=new Uint8Array(10);crypto.getRandomValues(a);const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const t=[...a].map(x=>ch[x%ch.length]).join('');k='TOM_TUNNEL-'+t.slice(0,5)+'-'+t.slice(5,10);localStorage.setItem('tt-device-key',k)}
    return k}catch(e){return 'TOM_TUNNEL-00000-00000'}}

/* ---------- Config share API (TOM_TUNNEL keys) ---------- */
const API_BASE='https://api.tomtunnel.com/v1';
async function apiCreateConfig(serverObj, title, expiresDays){
  const body={
    app:'TOM_TUNNEL', version:'1.0.0',
    config: btoa(unescape(encodeURIComponent(JSON.stringify(serverObj)))),
    title: title||serverObj.name||'Config',
    description: serverObj.type||'',
    expires: expiresDays||30,
    password:false
  };
  const r=await fetch(API_BASE+'/configs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiGetConfig(key){
  const r=await fetch(API_BASE+'/configs/'+encodeURIComponent(key),{method:'GET'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiDeleteConfig(key){
  const r=await fetch(API_BASE+'/configs/'+encodeURIComponent(key),{method:'DELETE'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function createShareKey(){
  const sv=curServer();
  if(!sv){toast(S.lang==='en'?'Select a server first':'Sélectionnez d’abord un serveur','bad');return}
  try{
    toast(S.lang==='en'?'Creating key…':'Création de la clé…');
    const res=await apiCreateConfig(sv, sv.name, 30);
    if(res&&res.key){
      const k=res.key;
      try{if(NATIVE&&JT.copyText)JT.copyText(k);else navigator.clipboard.writeText(k)}catch(e){}
      sheet(`<h3>${t('createKey')}</h3><p class="lead">${S.lang==='en'?'Share this key. Others can import it in TOM_TUNNEL.':'Partagez cette clé. Les autres pourront l’importer dans TOM_TUNNEL.'}</p>
        <div class="card" style="font-family:monospace;font-size:15px;text-align:center;padding:16px;letter-spacing:.5px">${esc(k)}</div>
        <div class="btns"><button class="btn ghost" onclick="closeSheet()">OK</button><button class="btn primary" onclick="if(NATIVE)JT.shareText('${esc(k)}');closeSheet()">${S.lang==='en'?'Share':'Partager'}</button></div>`);
      log(S.lang==='en'?'Share key created': 'Clé de partage créée', k, 'imp');
    } else toast(S.lang==='en'?'Failed to create key':'Échec de création de clé','bad');
  }catch(e){
    toast(S.lang==='en'?'API unavailable (use local export)':'API indisponible (utilisez l’export local)','bad');
    log('API', String(e.message||e), 'err');
  }
}
async function importShareKey(){
  sheet(`<h3>${t('importKey')}</h3>
    <label class="f"><span>Clé TOM_TUNNEL</span><input id="shareKeyIn" placeholder="TOM_TUNNEL-XXXXX-XXXXX" autocomplete="off" spellcheck="false" autocapitalize="characters"></label>
    <div id="shareKeyErr"></div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">${S.lang==='en'?'Cancel':'Annuler'}</button><button class="btn primary" onclick="doImportShareKey()">${S.lang==='en'?'Import':'Importer'}</button></div>`);
}
async function doImportShareKey(){
  const key=($('#shareKeyIn').value||'').trim().toUpperCase();
  if(!/^TOM_TUNNEL-[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(key)){
    $('#shareKeyErr').innerHTML='<p class="msg" role="alert">'+(S.lang==='en'?'Invalid key format':'Format de clé invalide')+'</p>';
    return;
  }
  try{
    toast(S.lang==='en'?'Downloading…':'Téléchargement…');
    const res=await apiGetConfig(key);
    if(!res||!res.success||!res.config) throw new Error('empty');
    let o;
    try{ o=JSON.parse(decodeURIComponent(escape(atob(res.config)))); }
    catch(e){ o=JSON.parse(atob(res.config)); }
    if(!o||!o.type) throw new Error('bad config');
    o.name = res.title || o.name || key;
    o.id = Date.now();
    confirmJephImport(o, res.title||key);
    closeSheet();
    log(S.lang==='en'?'Config imported from key':'Config importée via clé', key, 'imp');
  }catch(e){
    $('#shareKeyErr').innerHTML='<p class="msg" role="alert">'+(S.lang==='en'?'Key not found or expired':'Clé introuvable ou expirée')+'</p>';
    log('API import', String(e.message||e), 'err');
  }
}

function runSplash(){
  const sp=document.getElementById('splash');if(!sp)return;
  const done=()=>{sp.remove();document.documentElement.classList.remove('booting')};
  const b=document.getElementById('spBrand'),real=document.querySelector('.brand');
  if(!real||!b.animate){sp.style.transition='opacity .3s';sp.style.opacity=0;setTimeout(done,320);return}
  const c=b.getBoundingClientRect(),r=real.getBoundingClientRect(),bw=b.offsetWidth||1;
  b.style.animation='none';b.style.transformOrigin='0 0';b.style.left=c.left+'px';b.style.top=c.top+'px';
  const s0=c.width/bw,s1=r.width/bw;
  b.style.transform='translate(0,0) scale('+s0+')';
  const mv=b.animate([{transform:'translate(0px,0px) scale('+s0+')'},{transform:'translate('+(r.left-c.left)+'px,'+(r.top-c.top)+'px) scale('+s1+')'}],{duration:650,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  document.getElementById('spBg').animate([{opacity:1},{opacity:0}],{duration:520,delay:120,fill:'forwards'});
  mv.onfinish=done;
}
requestAnimationFrame(()=>setTimeout(runSplash,Math.max(0,750-performance.now())));
