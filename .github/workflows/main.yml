name: Build TOM_TUNNEL APK

on:
  push:
    branches: [main, master, principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -eux
          if [ -f "build.gradle (1).kts" ] && [ ! -f build.gradle.kts ]; then
            mv "build.gradle (1).kts" build.gradle.kts
          fi
          if [ -d app/main ] && [ ! -d app/src/main ]; then
            mkdir -p app/src
            mv app/main app/src/main
          fi
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          if [ -f settings.gradle.kts ] && ! grep -q jitpack.io settings.gradle.kts; then
            printf '%s\n' \
              'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
              'dependencyResolutionManagement {' \
              '  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
              '  repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }' \
              '}' \
              'rootProject.name = "TOM_TUNNEL"' \
              'include(":app")' > settings.gradle.kts
          fi
          echo "Structure OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bootstrap native engines
        run: |
          set -eux
          LIBS=app/libs
          JNI=app/src/main/jniLibs
          mkdir -p "$LIBS" "$JNI/arm64-v8a" "$JNI/x86_64"
          TMP=/tmp/tomtunnel-engines
          mkdir -p "$TMP"

          # hev AAR (version existante)
          HEV=2.19.1
          if [ ! -s "$LIBS/hev-socks5-tunnel.aar" ]; then
            curl -fL --retry 5 -o "$LIBS/hev-socks5-tunnel.aar" \
              "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV}/hev-socks5-tunnel.aar"
          fi
          ls -lh "$LIBS/hev-socks5-tunnel.aar"

          # Xray (v26.9.8 a été supprimé → v26.10.21)
          XRAY=26.10.21
          fetch_xray() {
            abi="$1"
            file="$2"
            out="$JNI/$abi/libxray.so"
            if [ -s "$out" ]; then echo "Xray $abi OK"; return; fi
            zip="$TMP/$file.zip"
            curl -fL --retry 5 -o "$zip" \
              "https://github.com/XTLS/Xray-core/releases/download/v\( {XRAY}/ \){file}.zip"
            unzip -p "$zip" xray > "$out"
            chmod 755 "$out"
            ls -lh "$out"
          }
          fetch_xray arm64-v8a Xray-android-arm64-v8a
          fetch_xray x86_64 Xray-android-amd64

          # DNSTT (optionnel — si échec on continue)
          set +e
          SRC="$TMP/dnstt"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 https://github.com/dnstt-xyz/dnstt_xyz_app.git "$SRC" 2>/dev/null || true
          fi
          if [ -d "$SRC" ]; then
            CLIENT=$(find "$SRC" -type d -name dnstt-client 2>/dev/null | head -1)
            MOD=$(find "$SRC" -name go.mod 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$CLIENT" ] && [ -n "$MOD" ]; then
              REL=${CLIENT#"\( MOD"}; REL= \){REL#/}; PKG="./${REL}"; [ -n "$REL" ] || PKG="."
              for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
                goarch=\( {pair%%:*}; abi= \){pair##*:}
                out="$JNI/$abi/libdnstt.so"
                [ -s "$out" ] && continue
                (cd "$MOD" && GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
                  go build -trimpath -ldflags='-s -w' -o "$out" "$PKG") || true
                [ -f "$out" ] && chmod 755 "$out"
              done
            fi
          fi
          set -e

          echo "Engines prêts :"
          find "$JNI" -type f -printf '  %p (%s bytes)\n' | sort
          ls -lh "$LIBS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK introuvable"
            find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14