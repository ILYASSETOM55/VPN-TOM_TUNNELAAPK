name: Build TOM_TUNNEL APK

on:
  push:
    branches: [main, master, principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -eux

          # 1) Renommer build.gradle mal nommé
          if [ -f "build.gradle (1).kts" ] && [ ! -f build.gradle.kts ]; then
            mv "build.gradle (1).kts" build.gradle.kts
          fi

          # 2) app/main -> app/src/main
          if [ -d app/main ] && [ ! -d app/src/main ]; then
            mkdir -p app/src
            mv app/main app/src/main
          fi
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64

          # 3) settings.gradle.kts avec JitPack
          cat > settings.gradle.kts << 'SEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "TOM_TUNNEL"
          include(":app")
          SEOF

          # 4) gradle.properties SANS espaces en début de ligne
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'kotlin.code.style=official' \
            'android.nonTransitiveRClass=true' > gradle.properties
          cat gradle.properties

          # 5) minSdk = 29
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 29/' app/build.gradle.kts
            grep -n minSdk app/build.gradle.kts || true
          fi

          # 6) extractNativeLibs
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/' app/src/main/AndroidManifest.xml || true
          fi

          # 7) Ressources minimales si absentes
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <string name="app_name">TOM_TUNNEL</string>' \
              '</resources>' > app/src/main/res/values/strings.xml
          fi

          echo "=== Structure ==="
          find app -maxdepth 4 -type d | head -40
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bootstrap native engines
        run: |
          set -eux
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 /tmp/engines

          curl -fL --retry 5 -o app/libs/hev-socks5-tunnel.aar \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.1/hev-socks5-tunnel.aar

          curl -fL --retry 5 -o /tmp/engines/xray-arm64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-android-arm64-v8a.zip
          unzip -p /tmp/engines/xray-arm64.zip xray > app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fL --retry 5 -o /tmp/engines/xray-amd64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-android-amd64.zip
          unzip -p /tmp/engines/xray-amd64.zip xray > app/src/main/jniLibs/x86_64/libxray.so
          chmod 755 app/src/main/jniLibs/x86_64/libxray.so

          echo Engines OK
          find app/src/main/jniLibs -type f
          ls -lh app/libs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -eux
          # Générer le wrapper si absent
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "APK introuvable"
            find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14