name: Build APK TOM_TUNNEL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git file

      - name: Prepare native VPN engines
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/bootstrap-engines.sh
          ./scripts/bootstrap-engines.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
