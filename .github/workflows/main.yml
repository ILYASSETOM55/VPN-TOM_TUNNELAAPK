name: Build TOM_TUNNEL APK

on:
  push:
    branches: [main, master, principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -euxo pipefail

          if [ -f "build.gradle (1).kts" ] && [ ! -f build.gradle.kts ]; then
            mv "build.gradle (1).kts" build.gradle.kts
          fi

          if [ -d app/main ] && [ ! -d app/src/main ]; then
            mkdir -p app/src
            mv app/main app/src/main
          fi

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          if [ -f settings.gradle.kts ] && ! grep -q "jitpack.io" settings.gradle.kts; then
            cat > settings.gradle.kts << 'SEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "TOM_TUNNEL"
          include(":app")
          SEOF
          fi

          echo "Structure OK"
          ls -la app/
          ls -la app/src/main/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept Android licenses
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bootstrap native engines
        run: |
          chmod +x scripts/bootstrap-engines.sh
          ./scripts/bootstrap-engines.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK introuvable"
            find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14