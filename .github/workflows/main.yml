name: Build TOM_TUNNEL APK

on:
  push:
    branches: [main, master, principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -eux

          if [ -f "build.gradle (1).kts" ] && [ ! -f build.gradle.kts ]; then
            mv "build.gradle (1).kts" build.gradle.kts
          fi

          if [ -d app/main ] && [ ! -d app/src/main ]; then
            mkdir -p app/src
            mv app/main app/src/main
          fi
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64

          python3 - <<'PY'
          open("settings.gradle.kts","w").write("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "TOM_TUNNEL"
          include(":app")
          """)
          PY

          python3 - <<'PY'
          open("gradle.properties","w").write(
          "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
          "android.useAndroidX=true\n"
          "android.enableJetifier=true\n"
          "kotlin.code.style=official\n"
          "android.nonTransitiveRClass=true\n"
          )
          PY
          echo "=== gradle.properties ==="
          cat -A gradle.properties

          if [ -f app/build.gradle.kts ]; then
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 29/' app/build.gradle.kts
            grep -n minSdk app/build.gradle.kts || true
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/' app/src/main/AndroidManifest.xml || true
          fi

          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            python3 - <<'PY'
          open("app/src/main/res/values/strings.xml","w").write(
          '<?xml version="1.0" encoding="utf-8"?>\n'
          '<resources>\n'
          '    <string name="app_name">TOM_TUNNEL</string>\n'
          '</resources>\n'
          )
          PY
          fi

          echo Structure OK
          ls -la
          ls -la app/src/main/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bootstrap native engines
        run: |
          set -eux
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 /tmp/engines

          # hev-socks5-tunnel (TUN → SOCKS5)
          curl -fL --retry 5 -o app/libs/hev-socks5-tunnel.aar \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.1/hev-socks5-tunnel.aar

          # Xray (VLESS / VMess / Trojan / Shadowsocks)
          curl -fL --retry 5 -o /tmp/engines/xray-arm64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-android-arm64-v8a.zip
          unzip -p /tmp/engines/xray-arm64.zip xray > app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fL --retry 5 -o /tmp/engines/xray-amd64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-android-amd64.zip
          unzip -p /tmp/engines/xray-amd64.zip xray > app/src/main/jniLibs/x86_64/libxray.so
          chmod 755 app/src/main/jniLibs/x86_64/libxray.so

          # DNSTT client (obligatoire pour SSH SlowDNS)
          git clone --depth 1 https://github.com/dnstt-xyz/dnstt_xyz_app.git /tmp/engines/dnstt_xyz_app
          CLIENT_DIR=/tmp/engines/dnstt_xyz_app/go_src/dnstt-client
          MOD_DIR="$CLIENT_DIR"
          while [ "$MOD_DIR" != "/tmp/engines/dnstt_xyz_app" ] && [ ! -f "$MOD_DIR/go.mod" ]; do
            MOD_DIR="$(dirname "$MOD_DIR")"
          done
          if [ ! -f "$MOD_DIR/go.mod" ]; then
            FOUND="$(find /tmp/engines/dnstt_xyz_app -name go.mod | head -n1)"
            MOD_DIR="$(dirname "$FOUND")"
          fi
          REL="${CLIENT_DIR#"\( MOD_DIR"}"; REL=" \){REL#/}"
          PKG="./${REL}"; [ -n "$REL" ] || PKG="."
          echo "Module Go : $MOD_DIR  (paquet $PKG)"

          for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
            goarch="\( {pair%%:*}"; abi=" \){pair##*:}"
            out="app/src/main/jniLibs/$abi/libdnstt.so"
            for goos in android linux; do
              if (cd "$MOD_DIR" && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                    go build -trimpath -ldflags='-s -w' -o "$out.tmp" "$PKG"); then
                mv "$out.tmp" "$out"
                chmod 755 "$out"
                echo "DNSTT $abi compilé (GOOS=$goos)"
                break
              fi
              rm -f "$out.tmp"
            done
            test -s "$out"
          done

          echo "=== Engines OK ==="
          find app/src/main/jniLibs -type f -printf '%p (%s bytes)\n' | sort
          ls -lh app/libs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -eux
          echo "=== Contenu gradle.properties avant build ==="
          cat -A gradle.properties
          grep -n "useAndroidX" gradle.properties

          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

          ./gradlew --no-daemon --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            :app:assembleDebug

      - name: Verify APK
        run: |
          set -eux
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo APK introuvable
            find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

          # Vérifier que libdnstt.so et libxray.so sont bien dans l'APK
          unzip -l "$APK" | grep -E 'libdnstt\.so|libxray\.so|libhev' || true
          echo "Vérification native libs:"
          unzip -l "$APK" | grep -E 'lib/.*/lib(dnstt|xray)\.so' || {
            echo "::error::libdnstt.so ou libxray.so manquant dans l'APK"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14