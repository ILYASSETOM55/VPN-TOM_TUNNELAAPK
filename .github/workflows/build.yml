name: Générer l'APK TOM_TUNNEL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        shell: bash
        run: |
          set -eu
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Bootstrap native engines
        shell: bash
        run: |
          set -euo pipefail

          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          TMP="$RUNNER_TEMP/engines"
          mkdir -p "$GITHUB_WORKSPACE/app/libs" "$JNI/arm64-v8a" "$JNI/x86_64" "$TMP"

          # 1) hev-socks5-tunnel (AAR)
          curl -fL --retry 5 -o "$GITHUB_WORKSPACE/app/libs/hev-socks5-tunnel.aar" \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.1/hev-socks5-tunnel.aar"

          # 2) Xray (arm64 + amd64)
          XRAY_VER="v26.10.21"
          curl -fL --retry 5 -o "$TMP/xray-arm64.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-android-arm64-v8a.zip"
          unzip -p "$TMP/xray-arm64.zip" xray > "$JNI/arm64-v8a/libxray.so"
          chmod 755 "$JNI/arm64-v8a/libxray.so"

          curl -fL --retry 5 -o "$TMP/xray-amd64.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-android-amd64.zip"
          unzip -p "$TMP/xray-amd64.zip" xray > "$JNI/x86_64/libxray.so"
          chmod 755 "$JNI/x86_64/libxray.so"

          # 3) DNSTT (client Go)
          git clone --depth 1 https://github.com/dnstt-xyz/dnstt_xyz_app.git "$TMP/dnstt_xyz_app"

          CLIENT_DIR="$TMP/dnstt_xyz_app/go_src/dnstt-client"
          if [ -f "$CLIENT_DIR/go.mod" ]; then
            MOD_DIR="$CLIENT_DIR"
          else
            MOD_DIR="$TMP/dnstt_xyz_app/go_src"
          fi
          if [ ! -f "$MOD_DIR/go.mod" ]; then
            echo "go.mod introuvable dans $MOD_DIR" >&2
            exit 1
          fi

          if [ "$CLIENT_DIR" = "$MOD_DIR" ]; then
            REL="."
          else
            REL="./${CLIENT_DIR#"$MOD_DIR"/}"
          fi
          echo "Module Go : ${MOD_DIR} (paquet ${REL})"

          cd "$MOD_DIR"
          for pair in "arm64:arm64-v8a" "amd64:x86_64"; do
            goarch="${pair%%:*}"
            abi="${pair##*:}"
            out="$JNI/${abi}/libdnstt.so"
            echo "Build dnstt-client pour ${goarch} -> ${out}"
            # Binaire statique Linux (fonctionne sur Android, lancé depuis nativeLibraryDir)
            GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "$out" "$REL"
            chmod 755 "$out"
          done

          ls -la "$JNI"/*/

      - name: Auto-fix Gradle config
        shell: bash
        run: |
          set -eu
          touch gradle.properties
          grep -q '^org.gradle.jvmargs' gradle.properties || \
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> gradle.properties
          grep -q '^android.useAndroidX' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^kotlin.code.style' gradle.properties || \
            echo 'kotlin.code.style=official' >> gradle.properties

          if [ -f app/build.gradle.kts ]; then
            F=app/build.gradle.kts
            if ! grep -q 'hev-socks5-tunnel' "$F" && ! grep -qE 'fileTree|libs/' "$F"; then
              printf '\ndependencies {\n    implementation(files("libs/hev-socks5-tunnel.aar"))\n}\n' >> "$F"
              echo "AAR hev ajouté aux dépendances"
            fi
            if ! grep -q 'useLegacyPackaging' "$F"; then
              printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$F"
              echo "useLegacyPackaging activé"
            fi
          elif [ -f app/build.gradle ]; then
            F=app/build.gradle
            if ! grep -q 'hev-socks5-tunnel' "$F" && ! grep -qE 'fileTree|libs/' "$F"; then
              printf '\ndependencies {\n    implementation files("libs/hev-socks5-tunnel.aar")\n}\n' >> "$F"
            fi
            if ! grep -q 'useLegacyPackaging' "$F"; then
              printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$F"
            fi
          else
            echo "app/build.gradle(.kts) introuvable" >&2
            ls -la . app || true
            exit 1
          fi

          if [ -f app/src/main/AndroidManifest.xml ] && \
             ! grep -q 'extractNativeLibs' app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<application android:extractNativeLibs="true"/' \
              app/src/main/AndroidManifest.xml
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -eo pipefail
          echo "--- Fichiers du projet ---"
          ls -la . app app/libs app/src/main app/src/main/jniLibs/* || true
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            curl -fL --retry 5 -o "$RUNNER_TEMP/gradle.zip" \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            GRADLE="$RUNNER_TEMP/gradle-8.10.2/bin/gradle"
          fi
          "$GRADLE" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          emit() {
            local m="$1"
            m="${m//'%'/'%25'}"
            m="${m//$'\r'/'%0D'}"
            m="${m//$'\n'/'%0A'}"
            echo "::error title=$2::$m"
          }
          WENT=$(awk '/What went wrong/{f=1} f{print} /^\* Try/{if(f)exit}' "$LOG" | head -25 | cut -c1-300)
          [ -n "$WENT" ] && emit "$WENT" "Gradle - What went wrong"
          KERR=$(grep -E '^e: |error: |AAPT|Manifest merger|Duplicate|Could not resolve|Unresolved reference' "$LOG" | head -15 | cut -c1-300)
          [ -n "$KERR" ] && emit "$KERR" "Erreurs de compilation"
          {
            echo "## Erreurs Gradle"
            echo '```'
            echo "$WENT"
            echo "$KERR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
